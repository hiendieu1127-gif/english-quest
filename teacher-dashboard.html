<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teacher Dashboard · English Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .td-wrap{ max-width:1100px; margin:0 auto; }
  .td-table{ width:100%; border-collapse:separate; border-spacing:0; background:#fff; border-radius:var(--radius-lg); overflow:hidden; box-shadow:var(--shadow-card); font-size:.88rem; }
  .td-table th, .td-table td{ padding:10px 14px; text-align:center; border-bottom:1px solid var(--line); white-space:nowrap; }
  .td-table th{ background:#f4f3ee; font-size:.75rem; text-transform:uppercase; letter-spacing:.03em; color:var(--ink-soft); }
  .td-table td.td-name{ text-align:left; font-weight:800; position:sticky; left:0; background:#fff; }
  .td-table th.td-name-h{ text-align:left; position:sticky; left:0; background:#f4f3ee; }
  .td-cell{ cursor:pointer; border-radius:8px; padding:4px 8px; display:inline-block; font-weight:800; }
  .td-cell.done{ background:color-mix(in srgb, var(--c-progress) 16%, white); color:#1a7a3e; }
  .td-cell.progress{ background:color-mix(in srgb, #e0a800 16%, white); color:#8a6400; }
  .td-cell.todo{ color:var(--ink-soft); font-weight:600; cursor:default; }
  .td-scroll{ overflow-x:auto; border-radius:var(--radius-lg); }
  .td-modal-backdrop{ position:fixed; inset:0; background:rgba(20,20,30,.5); display:none; align-items:center; justify-content:center; z-index:100; padding:20px; }
  .td-modal-backdrop.open{ display:flex; }
  .td-modal{ background:#fff; border-radius:var(--radius-lg); max-width:640px; width:100%; max-height:82vh; overflow-y:auto; padding:26px; }
  .td-modal h3{ margin-bottom:4px; }
  .td-modal .td-modal-meta{ color:var(--ink-soft); font-size:.9rem; margin-bottom:18px; }
  .td-qrow{ padding:10px 0; border-bottom:1px dashed var(--line); font-size:.9rem; }
  .td-qrow:last-child{ border-bottom:none; }
  .td-qrow .q{ font-weight:700; margin-bottom:4px; }
  .td-qrow .a-wrong{ color:#b5432a; }
  .td-qrow .a-right{ color:#1a7a3e; }
  .td-close{ float:right; background:none; border:none; font-size:1.4rem; cursor:pointer; color:var(--ink-soft); }
  .td-empty{ text-align:center; color:var(--ink-soft); padding:40px 0; }
</style>
</head>
<body data-page="teacher" style="--page-color: var(--c-progress);">
  <header class="site-header">
    <nav class="container nav-row" aria-label="Main navigation">
      <a class="brand" href="index.html">
        <span class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 5.5C4 4.7 4.7 4 5.5 4H12v16H5.5A1.5 1.5 0 0 1 4 18.5v-13Z" stroke-linejoin="round"/><path d="M20 5.5c0-.8-.7-1.5-1.5-1.5H12v16h6.5a1.5 1.5 0 0 0 1.5-1.5v-13Z" stroke-linejoin="round"/></svg></span>
        English Quest
      </a>
      <ul class="nav-links">
        <li><a class="navlink" href="vocabulary.html">Vocabulary</a></li>
        <li><a class="navlink" href="exercises.html">Exercises</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="page-hero">
      <div class="container">
        <span class="eyebrow" style="border-color: var(--page-color);">Teacher Dashboard</span>
        <h1>Kết quả học sinh</h1>
        <p>Bảng này tự động cập nhật khi có Unit mới — không cần chỉnh sửa trang này.</p>
      </div>
    </section>

    <section class="section" style="padding-top:10px;">
      <div class="container td-wrap">
        <div id="td-status" style="margin-bottom:14px;color:var(--ink-soft);font-size:.9rem;">Đang tải dữ liệu...</div>
        <div class="td-scroll">
          <table class="td-table" id="td-table" style="display:none;">
            <thead><tr id="td-head"></tr></thead>
            <tbody id="td-body"></tbody>
          </table>
        </div>
        <div class="td-empty" id="td-empty" style="display:none;">Chưa có học sinh nào làm bài.</div>
      </div>
    </section>
  </main>

  <div class="td-modal-backdrop" id="td-modal-backdrop">
    <div class="td-modal">
      <button class="td-close" id="td-modal-close">&times;</button>
      <div id="td-modal-content"></div>
    </div>
  </div>

<script src="vocabulary.js"></script>
<script type="module" src="results-service.js"></script>
<script src="teacher-dashboard.js"></script>
</body>
</html>
